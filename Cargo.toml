[workspace]
resolver = "3"
members = ["crates/prism-core", "platforms/windows"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
prism-core = { path = "crates/prism-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
png = "0.18"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev]
opt-level = 1

# Pixel loops (blur, dimming, PNG) are far too slow unoptimised; keep dependencies fast in dev.
[profile.dev.package."*"]
opt-level = 3
